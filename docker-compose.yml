services:
  spark-master:
    image: apache/spark:3.5.7
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./infra/spark:/opt/project/spark:ro
    networks:
      - cloudpredict-net

  spark-worker-1:
    image: apache/spark:3.5.7
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - cloudpredict-net

  spark-worker-2:
    image: apache/spark:3.5.7
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - cloudpredict-net

networks:
  cloudpredict-net:
    driver: bridge
