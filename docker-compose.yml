services:
  spark-master:
    image: apache/spark:3.5.7
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./infra/spark:/opt/project/spark:ro
    networks:
      - cloudpredict-net

  spark-worker-1:
    image: apache/spark:3.5.7
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - cloudpredict-net

  spark-worker-2:
    image: apache/spark:3.5.7
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - cloudpredict-net

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    environment:
      CLUSTER_NAME: cloudpredict-hdfs
    env_file:
      - ./infra/hadoop/hadoop.env
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
    ports:
      - "127.0.0.1:9870:9870"
    networks:
      - cloudpredict-net
    restart: unless-stopped

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode1
    env_file:
      - ./infra/hadoop/hadoop.env
    environment:
      SERVICE_PRECONDITION: namenode:9870
    volumes:
      - hdfs_datanode1:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - cloudpredict-net
    restart: unless-stopped

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode2
    env_file:
      - ./infra/hadoop/hadoop.env
    environment:
      SERVICE_PRECONDITION: namenode:9870
    volumes:
      - hdfs_datanode2:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - cloudpredict-net
    restart: unless-stopped

  kafka:
    networks:
      - cloudpredict-net
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      retries: 10

  kafka-init:
    networks:
      - cloudpredict-net
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic cloudpredict.metrics.raw
      --partitions 3 --replication-factor 1"

  kafka-ui:
    networks:
      - cloudpredict-net
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cloudpredict
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

networks:
  cloudpredict-net:
    driver: bridge

volumes:
  hdfs_namenode:
  hdfs_datanode1:
  hdfs_datanode2:
